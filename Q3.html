<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of list</title>
</head>
<body>
    <h1>Types of list</h1>
    <h2>a) Ordered List</h2>
    <ol>
        <li>AWS</li>
        <li>CPP</li>
        <li>CE</li>
        <li>DR</li>
    </ol>

    <h2>b) Unordered List</h2>
    <ul>
        <li>DLD</li>
        <li>PYS</li>
        <li>GER</li>
        <li>DR Lab</li>
    </ul>
    <h2>c) Description List</h2>
    <dl>
        <dt><b>AWS</b></dt>
        <dd>Amazon Web Services</dd>
        <dt><b>CPP</b></dt>
        <dd>C++ Programming</dd>
        <dt><b>CE</b></dt>
        <dd>Computer Engineering</dd>
        <dt><b>HTML</b></dt>
        <dd>HyperText Markup Language</dd>
    </dl>
</body>
</html>
