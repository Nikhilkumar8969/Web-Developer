<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Box Model</title> 
 
    <style> 
        * { 
            box-sizing: border-box; 
        } 
 
        body { 
            margin: 0; 
            background-color: white; 
            font-family: "Times New Roman", serif; 
        } 
 
        .container { 
            position: relative; 
            width: 1100px; 
            height: 1500px; 
            margin: 10px; 
        } 
 
        .top-box { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 355px; 
            height: 360px; 
            background-color: #1cf0f0; 
            border: 15px solid black; 
            padding: 20px; 
        } 
 
        .top-box p { 
            margin: 0; 
            font-size: 24px; 
            line-height: 1.2; 
            font-weight: bold; 
        } 
 
        .middle-box { 
            position: absolute; 
            top: 420px; 
            left: 455px; 
            width: 390px; 
            height: 425px; 
            background-color: #c95ad8; 
            border: 15px solid black; 
            padding: 20px 10px; 
        } 
 
        .bottom-box { 
            position: absolute; 
            top: 885px; 
            left: 70px; 
            width: 390px; 
            height: 390px; 
            background-color: #e2cbd4; 
            border: 15px solid black; 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="container"> 
 
        <div class="top-box"> 
            <p> 
            Good morning everyone, I’m **Nikhil Kumar**, a first-year B.Tech student in **Computer Science and Information Technology**. 
            </p> 
        </div> 
 
        <div class="middle-box">
            <p>
                I am currently studying in KIET DEEMED TO BE UNIVERSITY.
            </p>
        </div> 
 
        <div class="bottom-box">
            <p>
                I am learning web development.
            </p>
        </div> 
 
    </div> 
</body> 
</html>
