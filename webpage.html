<!DOCTYPE html>
<html>
<head>
    <title>WEBPAGE CSS</title>

    <style>
        body {
            background-image: url("background.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        h1 {
            font-family: Arial, sans-serif;
            color: navy;
            text-align: center;
        }

        p {
            font-family: "Times New Roman", serif;
            color: red;
            font-size: 20px;
            font-style: italic;
        }

        p2 {
            font-family: Verdana, sans-serif;
            color: green;
            font-size: 18px;
            font-weight: bold;
        }

        .box {
            width: 500px;
            padding: 20px;
            margin: 20px auto;
            color: rgb(11, 9, 9);
            text-align: center;
            background-image: url("https://i0.wp.com/picjumbo.com/wp-content/uploads/free-background-free-image.jpeg?w=600&quality=80");
            background-size: cover;
            border: 2px solid rgb(16, 13, 13);
        }

    </style>
</head>
<body>

    <h1>Nikhil Kumar</h1>

    <p>
        I am a student of Computer Science and Information Technology.
    </p>

    <p2>
        I am currently studying in KIET DEEMED TO BE UNIVERSITY.
    </p2>

    <div class="box">
        <h2> A BACKGROUND IMAGE</h2>
        <p3>I am learning web development.</p3>
    </div>

</body>
</html>
